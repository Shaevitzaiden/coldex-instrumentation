[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumatic-valve-panel"
version = "0.4.0"
description = "Multi-device PyQt5 pneumatic control, stream hub, live plots, and recorder"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "PyYAML>=6.0",
    "pyqtgraph>=0.13",
    "numpy>=1.23",
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "other/vacuum_instrumentation_bundle_v2/python",
]
testpaths = [
    "tests",
    "other/vacuum_instrumentation_bundle_v2/python/tests",
]
