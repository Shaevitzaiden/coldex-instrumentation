  background_color: '#f8f8f8'
valve_types:
  solenoid_2_way:
    display_name: 2-Way Solenoid Valve
    shape: circle
    description: Simple relay-driven on/off valve.
  solenoid_3_way:
    display_name: 3-Way Solenoid Valve
    shape: diamond
    description: Directional or routing valve.
  selector_valve:
    display_name: Selector / Routing Valve
    shape: hexagon
    description: Manifold selector or routing valve.
  pneumatic_actuator:
    display_name: Pneumatic Actuator
    shape: rounded_rect
    description: Cylinder, bladder, gripper, or other actuator.
  pump_or_source:
    display_name: Pump / Pressure Source
    shape: triangle
    description: Pump, vacuum source, or pressure-source relay.
