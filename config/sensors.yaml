  # Only produced by the simulated controller (python run_app.py --demo); the
  # real relay firmware has no temperature sensor.
  controller.temperature:
    label: Controller Temperature (demo only)
    source_device: controller
    source_channel: controller_temperature
    unit: °C
    expected_sampling_hz: 1
    enabled: true
    default_log: false
    metadata:
      quantity: temperature

  thermocouple.temperature:
    label: Thermocouple
    source_device: thermocouple
    source_channel: temperature
    unit: °C
    expected_sampling_hz: 2
    enabled: true
    default_log: true
    description: MCP9601 K-type thermocouple (enable the device in devices.yaml).
    metadata:
      quantity: temperature

  environment.temperature:
    label: Ambient Temperature
    source_device: environment
    source_channel: ambient_temperature
    unit: °C
    expected_sampling_hz: 5
    enabled: true
    default_log: false
    metadata:
      quantity: temperature

