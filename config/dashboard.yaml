schema_version: 1
dashboard:
  rows: 2
  columns: 2
  row_stretches:
  - 3
  - 1
  column_stretches:
  - 3
  - 2
  tiles:
  - id: valve_panel_main
    type: valve_panel
    title: Pneumatic Valve Panel
    row: 0
    column: 0
    row_span: 1
    column_span: 1
    removable: false
    config: {}
  - id: recording_session
    type: recording
    title: Session Recording
    row: 1
    column: 1
    row_span: 1
    column_span: 1
    removable: false
    config: {}
  - id: tile_01
    type: sensor_plot_readout
    title: New Tile
    row: 0
    column: 1
    row_span: 1
    column_span: 1
    removable: true
    config:
      channels:
      - controller.temperature
      - environment.temperature
      history_seconds: 30.0
      quantity: temperature
      unit: "\xB0C"
      y_label: "Temperature [\xB0C]"
      default_decimals: 2
      value_font_size: 24
      show_units: true
      show_source: false
      stale_after_s: 0.0
      readout_columns: 2
  - id: tile_02
    type: crusher_control
    title: New Tile
    row: 1
    column: 0
    row_span: 1
    column_span: 1
    removable: true
    config:
      initialize_retracted: true
      crushers:
      - id: crusher_1
        label: Crusher 1
        actuator_id: crusher_1
      - id: crusher_2
        label: Crusher 2
        actuator_id: crusher_2
      - id: crusher_3
        label: Crusher 3
        actuator_id: crusher_3
      - id: crusher_4
        label: Crusher 4
        actuator_id: crusher_4
  dock_layout_version: fixed_grid_v1
